<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BOC - Sign In</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <img id="logo" src="assets/logo.svg" alt="Bank of Ceylon logo" />
      <h1>Bankers to the Nation</h1>
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" placeholder="email@example.com" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" placeholder="Enter your password" required />
            <button type="button" id="togglePassword" aria-label="Show password">Show</button>
          </div>
        </div>
        <div class="actions">
          <label class="remember"><input type="checkbox" id="remember" /> Remember me</label>
          <button type="submit" class="btn primary">Sign In</button>
        </div>
      </form>
      <p class="help">Need help? <a href="#">Contact support</a></p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
